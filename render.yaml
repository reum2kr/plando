services:
  - type: web
    name: plando-diary
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plando-db
          property: connectionString
      - key: PORT
        value: 3000

databases:
  - name: plando-db
    plan: free
